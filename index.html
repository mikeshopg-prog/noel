<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tirage de Noël 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout : une seule carte centrée. Avec un lien perso, elle montre directement la personne tirée. Thème unique "nuit de sapin". */
:root {
  --bg: #0e2620;
  --bg-2: #15342b;
  --paper: #f4efe4;
  --ink: #1b2a24;
  --muted: #8fa89c;
  --gold: #e0b04f;
  --berry: #c2413f;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  background-image: radial-gradient(circle at 20% -10%, var(--bg-2), transparent 60%);
  color: var(--paper);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
canvas#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
main { position: relative; z-index: 1; min-height: 100%; max-width: 520px; margin: 0 auto; padding: 40px 16px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.year { font-family: var(--display); font-weight: 600; color: var(--gold); letter-spacing: 0.12em; text-transform: uppercase; font-size: 13px; text-align: center; }
.card { background: var(--paper); color: var(--ink); border-radius: 22px; padding: 32px 24px; display: flex; flex-direction: column; gap: 10px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
.hi { margin: 0; color: #5a6b62; font-size: 17px; }
.to { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 12vw, 60px); line-height: 1.05; color: var(--berry); margin: 4px 0 6px; text-wrap: balance; }
.hint { margin: 0; font-size: 14px; color: #5a6b62; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 8vw, 38px); line-height: 1.1; margin: 0; text-wrap: balance; }
.muted { color: #5a6b62; margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  .to { animation: pop 700ms cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(0.6); opacity: 0.2; } to { transform: scale(1); opacity: 1; } }
}
footer { color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main>
  <span class="year">Tirage de Noël 2026</span>
  <section class="card" id="card" aria-live="polite">
    <h1>Ouvre ton lien perso</h1>
    <p class="muted">Pour découvrir à qui tu offres ton cadeau, ouvre le lien personnel que tu as reçu par mail.</p>
  </section>
  <footer>Chacun ne voit que sa propre personne.</footer>
</main>

<script>
// Chaque entrée est chiffrée avec le jeton du lien perso : sans le lien, impossible de savoir qui offre à qui.
const E = [{"i":"1cec345e34a4472e2be0","c":"LJJe1Oc6ZoHyFJqvIX6b9vwjAw=="},{"i":"24590120e9893206436b","c":"tuH4sQ1UeP5nV95nTQ=="},{"i":"327975eaf0fc4ba1435e","c":"DUaRWpXiGrJst1cuFJgDJNja"},{"i":"336dea5a6b7ce9416126","c":"5wu4oLyrmG7WyM0iW5kwv1dKVwnAyUQ="},{"i":"3a56b2bd71fd37c8acc2","c":"Zr4huE07SaRyvLgd6ls="},{"i":"3ea97f8b40c644ca5bbb","c":"YuuOrDI87jpOP7SXhm/yAlN4Wi15"},{"i":"4ebba4f999e41064ad12","c":"hBuaL2ooJJ1jC/qNFh46SKYc"},{"i":"65f5b497a0dda6e3524b","c":"tYPiua2KFUEBkoFlflz+v4CKyw=="},{"i":"9817a6de28965d744236","c":"5+3HTOJT+351rsYEdw=="},{"i":"a5bb8a28a42ab6be3b09","c":"JF7HWJgCqIQDOhM8"},{"i":"c31036cb63e7d97e1fc6","c":"QTPK0FHacDfuE92y+NHZPCe/gw=="},{"i":"cad522394dcee03c1580","c":"m9wt5lMv7xN0/V9h"},{"i":"da3c66099b882db39df7","c":"V/mMqBFArR7+yHg="},{"i":"db385aa99c2bcc247b62","c":"b2qNaITRmQknBNNt"},{"i":"fa6737f42612fd09be17","c":"kZBGx5BveqCMdR+lzPwk1VgiDgnBaw=="},{"i":"fb33258a7e064635a3e6","c":"CoZvvbyrQhkoVcO5"}];
const enc = new TextEncoder();
async function sha(alg, s) { return new Uint8Array(await crypto.subtle.digest(alg, enc.encode(s))); }
const hex = (b) => [...b].map(x => x.toString(16).padStart(2, "0")).join("");
function card(html) { document.getElementById("card").innerHTML = html; }
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function show() {
  const t = decodeURIComponent(location.hash.slice(1)).trim().toLowerCase();
  if (!t) {
    card(`<h1>Ouvre ton lien perso</h1><p class="muted">Pour découvrir à qui tu offres ton cadeau, ouvre le lien personnel que tu as reçu par mail.</p>`);
    return;
  }
  try {
    const id = hex(await sha("SHA-256", "id:" + t)).slice(0, 20);
    const e = E.find(x => x.i === id);
    if (!e) {
      card(`<h1>Lien incomplet</h1><p class="muted">Ce lien ne correspond à personne. Rouvre le lien depuis ton mail, en entier, ou demande-le à nouveau à Arnaud.</p>`);
      return;
    }
    const k = await sha("SHA-512", "key:" + t);
    const c = Uint8Array.from(atob(e.c), ch => ch.charCodeAt(0));
    const [giver, to] = new TextDecoder().decode(c.map((b, j) => b ^ k[j])).split("|");
    card(`<p class="hi">Salut ${esc(giver.split(" ")[0])}, tu offres un cadeau à</p><p class="to">${esc(to)}</p><p class="hint">Garde le secret jusqu'au jour J.</p>`);
  } catch (err) {
    card(`<h1>Oups</h1><p class="muted">Ton navigateur n'a pas pu ouvrir le tirage. Essaie d'ouvrir le lien dans Safari ou Chrome.</p>`);
  }
}
show();
addEventListener("hashchange", show);

(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("snow"), cx = cv.getContext("2d");
  let W, H, flakes;
  function size() {
    W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio;
    flakes = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.8 + 0.6) * devicePixelRatio, v: (Math.random() * 0.5 + 0.25) * devicePixelRatio, w: Math.random() * 6.28 }));
  }
  size(); addEventListener("resize", size);
  (function tick() {
    cx.clearRect(0, 0, W, H); cx.fillStyle = "rgba(244,239,228,0.55)";
    for (const f of flakes) {
      f.y += f.v; f.w += 0.01; f.x += Math.sin(f.w) * 0.3 * devicePixelRatio;
      if (f.y > H) { f.y = -5; f.x = Math.random() * W; }
      cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, 6.28); cx.fill();
    }
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
